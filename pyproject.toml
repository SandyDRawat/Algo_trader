[project]
name = "algotrader"
version = "2.0.0a1"
description = "Backtest, learn and paper-trade strategies on Indian markets"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ai = ["anthropic>=2.3"]
mcp = ["mcp>=2.3"]
yahoo = ["yfinance>=0.2.50"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algotrader"]
